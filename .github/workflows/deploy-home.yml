name: Build and Push Home Site

on:
  push:
    branches:
      - main
    paths:
      - "home/**"
      - ".github/workflows/deploy-home.yml"

env:
  IMAGE_NAME: home

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${IMAGE_NAME}:latest" \
            ./home
          docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Notify Discord on push
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            MESSAGE="✅ New image pushed to Artifact Registry\n\`${IMAGE_NAME}:${IMAGE_TAG}\`"
          else
            COLOR=15158332
            MESSAGE="❌ Image push failed for \`${IMAGE_NAME}\`"
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Potato Cloud · Home Site\",\"description\":\"$MESSAGE\",\"color\":$COLOR}]}"
